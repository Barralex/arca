[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arca-backup"
dynamic = ["version"]
description = "A terminal interface for rclone backups on Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luis Barral" }]
keywords = ["rclone", "backup", "tui", "textual", "windows"]
dependencies = ["textual>=8.2.8"]

[project.scripts]
arca = "arca.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.hatch.version]
path = "arca/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["arca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
